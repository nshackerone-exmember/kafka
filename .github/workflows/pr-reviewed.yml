name: Pull Request Reviewed

on:
  pull_request:
  push:
    branches: [trunk]

jobs:
  save-pr-number:
    name: Save PR Number
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: PR_NUMBER.txt
          path: PR_NUMBER.txt
